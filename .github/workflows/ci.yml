name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo fmt --check --manifest-path fuzz/Cargo.toml
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # CC / scheduler boundary (invariants 2-3): one `run` per check, since bash -e does not
      # stop on a failing `!` command.
      - name: tcp/ never names the scheduler
        run: "! grep -rnE 'crate::mptcp|sched|Scheduler|SubflowSnapshot' --exclude=tests.rs crates/mptcp-rs/src/tcp/"
      - name: the scheduler never reaches Tcb or CC
        run: "! grep -nE 'use crate::tcp::(Tcb|cc|CongestionControl)' crates/mptcp-rs/src/mptcp/sched.rs"
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "fuzz" }
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - run: cargo fuzz run mptcp_option -- -max_total_time=60
      - run: cargo fuzz run handle_packet -- -max_total_time=60
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
  # M3 Interop Suite against the runner's kernel MPTCP (amendment §5.7). Docker does not pin the
  # kernel, so the probe step fails loudly when a feature the suite uses is missing. The whole
  # catalog runs, split over one runner per shard: cases share namespace names and are
  # timing-sensitive, so they never run side by side on one machine.
  interop-suite:
    runs-on: ubuntu-26.04  # kernel 7.0, the suite's reference series
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: probe kernel MPTCP, TUN, netns, netem, ip(6)tables and nstat counters
        run: |
          docker build -q -t mptcp-rs-m1-test:local tests/interop
          docker run --rm --privileged --network none -v "$PWD":/w -w /w mptcp-rs-m1-test:local bash -euxc '
            uname -r
            test -c /dev/net/tun
            ip netns add p
            test "$(ip netns exec p sysctl -n net.mptcp.enabled)" = 1
            ip -n p link add v0 type veth peer name v1
            ip netns exec p tc qdisc add dev v0 root netem rate 20mbit delay 10ms
            for t in iptables ip6tables; do ip netns exec p $t -A FORWARD -o v0 -j DROP; done
            ip netns exec p ip tuntap add dev t0 mode tun
            ip netns exec p nstat -azs >/tmp/nstat.txt
            for c in $(python3 -c "import sys; sys.path.insert(0, \"tests/interop/suite\"); import cases; print(*{k for c in cases.CASES for k in c[\"expect\"][\"nstat\"]})"); do
              grep -q "^$c " /tmp/nstat.txt
            done'
      - name: decoder unit tests
        run: docker run --rm -v "$PWD":/w -w /w mptcp-rs-m1-test:local python3 -m unittest tests/interop/suite/test_decode.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p mptcp-rs-tun
      - run: bash tests/interop/suite/run.sh --runs 1 --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interop-suite-${{ matrix.shard }}
          path: artifacts/interop/suite
