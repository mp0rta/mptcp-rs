name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment registered as the crates.io Trusted Publisher.
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: tag matches the crate version
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo pkgid -p mptcp-rs | sed 's/.*[#@]//')"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p mptcp-rs --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
