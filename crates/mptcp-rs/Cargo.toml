[package]
name = "mptcp-rs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Sans-I/O userspace implementation of the MPTCP protocol (RFC 8684) and TCP, client side"
repository = "https://github.com/mp0rta/mptcp-rs"
readme = "../../README.md"
keywords = ["mptcp", "multipath", "tcp", "sans-io", "networking"]
categories = ["network-programming"]

[dependencies]
sha2 = "0.11"
hmac = "0.13"
etherparse = "0.21"
rangemap = "1.8"
rand_core = "0.10"

[dev-dependencies]
rand_chacha = "0.10"
